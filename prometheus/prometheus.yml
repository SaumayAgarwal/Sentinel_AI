          service: 'inventory-service'
    metrics_path: /metrics

  - job_name: 'sentinelflow-monitoring-service'
    static_configs:
      - targets: ['host.docker.internal:3005']
        labels:
          service: 'monitoring-service'
    metrics_path: /metrics

  - job_name: 'sentinelflow-incident-service'
    static_configs:
      - targets: ['host.docker.internal:3006']
        labels:
          service: 'incident-service'
    metrics_path: /metrics

  - job_name: 'sentinelflow-recovery-service'
    static_configs:
      - targets: ['host.docker.internal:3007']
        labels:
          service: 'recovery-service'
    metrics_path: /metrics

  - job_name: 'sentinelflow-notification-service'
    static_configs:
