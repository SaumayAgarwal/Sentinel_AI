global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'sentinelflow-user-service'
    static_configs:
      - targets: ['host.docker.internal:3001']
        labels:
          service: 'user-service'
    metrics_path: /metrics

  - job_name: 'sentinelflow-order-service'
    static_configs:
      - targets: ['host.docker.internal:3002']
        labels:
          service: 'order-service'
    metrics_path: /metrics

  - job_name: 'sentinelflow-payment-service'
    static_configs:
      - targets: ['host.docker.internal:3003']
        labels:
          service: 'payment-service'
    metrics_path: /metrics

  - job_name: 'sentinelflow-inventory-service'
    static_configs:
      - targets: ['host.docker.internal:3004']
